name: Build APK

on:
  push:
    branches: [main, "phase1-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (API level check, does not block the build)
        if: always()
        continue-on-error: true
        run: |
          ./gradlew lintDebug || true
          echo "---- NewApi findings ----"
          grep -B2 -A8 "NewApi\|InlinedApi" app/build/reports/lint-results-debug.txt || echo "none"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AthanWallClock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
